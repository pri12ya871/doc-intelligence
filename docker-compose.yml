services:
  postgres:
    # pgvector image rather than plain postgres — the vector extension has to
    # exist in the image, CREATE EXTENSION alone cannot install it.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docint
      POSTGRES_PASSWORD: docint
      POSTGRES_DB: docint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docint"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: sh -c "node scripts/migrate.js && node src/server.js"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://docint:docint@postgres:5432/docint
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: node src/worker.js
    environment:
      DATABASE_URL: postgres://docint:docint@postgres:5432/docint
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
    volumes:
      # The worker reads the PDFs the API wrote, so both mount the same volume.
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
