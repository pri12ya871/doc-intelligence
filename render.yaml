# One-click deployment blueprint for Render (free tier).
#
# DATABASE_URL must point at a real Postgres with pgvector (Neon's free tier
# works). The embedded-PGlite local mode is deliberately NOT used here: the
# whole Postgres engine runs inside the Node process and idles at ~270MB,
# which leaves no headroom inside Render's 512MB free container — the first
# deploy attempt with PGlite died with an out-of-memory kill. A networked
# Postgres drops the process to a comfortable size and makes demo data
# durable instead of resetting on every restart.
#
# REDIS_URL stays unset: the in-memory cache fallback is small, and a public
# demo doesn't need cross-instance rate limiting.
services:
  - type: web
    name: doc-intelligence
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node scripts/migrate.js && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Defensive ceilings for a 512MB container: cap the V8 heap below the
      # container limit so a memory spike fails one request instead of killing
      # the process, and keep uploads small enough that pdf.js can parse them
      # within the remaining headroom.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: MAX_UPLOAD_MB
        value: "10"
      # Set these three in the Render dashboard — credentials never live in
      # the repository.
      - key: DATABASE_URL
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
